<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Restaurant Menu"
    >

    <title>Restaurant Menu</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header class="restaurant-header">

        <h1 id="restaurantName">
            Loading...
        </h1>

        <div
            id="restaurantLocation"
            class="location"
        ></div>

        <p
            id="restaurantDescription"
            class="description"
        ></p>

    </header>


    <div
        id="categories"
        class="categories"
    ></div>


    <main
        id="menu"
        class="menu"
    ></main>


    <div
        id="loading"
        class="message"
    >
        Loading menu...
    </div>


    <div
        id="error"
        class="message error hidden"
    ></div>


    <script src="config.js"></script>
    <script src="app.js"></script>

</body>

</html>
